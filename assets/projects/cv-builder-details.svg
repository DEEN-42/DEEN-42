<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Collaborative CV Builder: 90% smaller payloads with binary state-vector deltas; 96% fewer synchronous DB writes (BullMQ write-behind); Sub-millisecond in-memory reconciliation; Cross-server fan-out with Redis Pub/Sub.">
<title>Collaborative CV Builder: 90% smaller payloads with binary state-vector deltas; 96% fewer synchronous DB writes (BullMQ write-behind); Sub-millisecond in-memory reconciliation; Cross-server fan-out with Redis Pub/Sub.</title>
<style>.cv{opacity:0;fill:#0D0D0D;animation:cv .5s steps(3,end) both}.cv.h{animation-name:cvh}@keyframes cv{0%{opacity:1;fill:#0D0D0D}50%{opacity:1;fill:#161616}80%,100%{opacity:0}}@keyframes cvh{0%{opacity:1;fill:#0D0D0D}45%{opacity:1;fill:#F5A524}80%,100%{opacity:0}}.up{animation:up .4s ease-out both}@keyframes up{0%{opacity:0;transform:translateY(6px)}75%,100%{opacity:1;transform:none}}.ln{animation:ln .35s ease-out both}@keyframes ln{0%{opacity:0;transform:translateX(-6px)}75%,100%{opacity:1;transform:none}}.live{animation:live 1.6s steps(1) infinite}@keyframes live{50%{opacity:.25}}.bk{animation:bk 1.1s steps(1) infinite}@keyframes bk{50%{opacity:0}}.cn{opacity:0;animation:cn .08s steps(1,end)}@keyframes cn{from,to{opacity:1}}@media (prefers-reduced-motion:reduce){.cv,.up,.ln,.live,.bk,.cn,.tw,.ty{animation:none}}</style>

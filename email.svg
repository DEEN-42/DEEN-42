<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="Decorative flowing signal divider">
<title>Decorative flowing signal divider</title>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a34"/><stop offset="1" stop-color="#090e1c"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#49dcff"/><stop offset=".6" stop-color="#8f92ff"/><stop offset="1" stop-color="#b780ff"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#90aaff" stroke-opacity=".07"/></pattern>
</defs>
<style>.signal{animation:travel 7s ease-in-out infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(850px);opacity:0}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style>
<path d="M0 12H1000" stroke="#253452"/>
<rect class="signal" y="11" width="150" height="2" rx="1" fill="url(#accent)"/>

</svg>